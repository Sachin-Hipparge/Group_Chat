<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Chat</title>

    <link rel="stylesheet" href="chat.css">
</head>

<body>

    <div class="chat-container">

        <!-- Chat Header -->
        <header class="chat-header">

            <div class="user-info">
                <div class="avatar">G</div>

                <div>
                    <h2>Group Chat</h2>
                    <p>Online</p>
                </div>
            </div>

        </header>


        <!-- Messages Area -->
        <main class="messages" id="messages">

            <div class="message received">
                <div class="message-content">
                    <p class="sender">Rahul</p>
                    <p>Hello everyone!</p>

                    <span class="timestamp">10:30 AM</span>
                </div>
            </div>


            <div class="message sent">
                <div class="message-content">
                    <p>Hi Rahul!</p>

                    <span class="timestamp">10:31 AM</span>
                </div>
            </div>


            <div class="message received">
                <div class="message-content">
                    <p class="sender">Priya</p>
                    <p>How is everyone doing?</p>

                    <span class="timestamp">10:32 AM</span>
                </div>
            </div>


            <div class="message sent">
                <div class="message-content">
                    <p>I'm doing great 👍</p>

                    <span class="timestamp">10:33 AM</span>
                </div>
            </div>

        </main>


        <!-- Message Input -->
        <footer class="message-input-container">

            <input
                type="text"
                id="message-input"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </footer>

    </div>


    <script src="chat.js"></script>

</body>

</html>
