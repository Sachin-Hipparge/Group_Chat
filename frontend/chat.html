<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Chat</title>

    <link rel="stylesheet" href="chat.css">
</head>

<body>

    <div class="chat-container">

        <!-- Chat Header -->
        <header class="chat-header">

            <div class="user-info">
                <div class="avatar">G</div>

                <div>
                    <h2>Group Chat</h2>
                    <p>Online</p>
                </div>
            </div>

        </header>


        <!-- Messages Area -->
        <main class="messages" id="messages">
        </main>


        <!-- Message Input -->
       <footer class="message-input-container">
    <input
    type="email"
    id="recipient-input"
    placeholder="Recipient email"
    autocomplete="off"
>

<div class="group-controls">
    <input
        type="text"
        id="group-input"
        placeholder="Group name"
        autocomplete="off"
    >

    <button id="join-group-button">Join Group</button>
    <button id="leave-group-button">Leave Group</button>
</div>

<p id="current-group">No group joined</p>


    <input
    type="file"
    id="media-input"
    accept="image/*,video/*,.pdf,.doc,.docx,.txt"
>

<button id="media-send-button">Send Media</button>


    <input
        type="text"
        id="message-input"
        placeholder="Type a message..."
        autocomplete="off"
    >

    <button id="send-button">Send</button>
</footer>

    </div>


    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="chat.js"></script>

</body>

</html>
